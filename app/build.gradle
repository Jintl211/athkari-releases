plugins {
    id 'com.android.application'
}

android {
    namespace 'com.salah.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.salah.app2"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.8"

        resConfigs "ar", "en"
        vectorDrawables.useSupportLibrary true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Signing config: use the default debug signing for now so assembleRelease
            // produces a runnable APK out of the box. Replace with your own keystore
            // before publishing to Google Play.
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/DEPENDENCIES',
                '/META-INF/LICENSE*'
            ]
        }
    }

    aaptOptions {
        additionalParameters "--no-version-vectors"
        failOnMissingConfigEntry false
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
    
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.batoulapps.adhan:adhan:1.2.0'
}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jsoup:jsoup:1.17.2'
}
